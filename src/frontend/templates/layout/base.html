<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Bookmarker</title>
    
    <!-- Favicon -->
    <link rel="icon" href="/static/favicon.ico">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <!-- <link rel="stylesheet" href="/static/css/main.css"> -->
     <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
</head>
<body>

    <!-- Main Layout -->
    <div class="container">

        <!-- Sidebar -->
        {% include "partials/sidebar.html" %}
        
        <!-- Main Content -->
        <main id="main-content" class="content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <!-- Global Modals -->
    <div id="collectionModal" class="modal">
        <div class="modal-content">
            <span class="modal-close" onclick="modal.close('collectionModal')">×</span>
            <h2>Create New Collection</h2>
            <form id="collectionForm">
                <div class="form-group">
                    <label for="collectionName">Name (100 chars max)</label>
                    <input type="text" id="collectionName" name="name" maxlength="100" required>
                </div>
                <div class="form-group">
                    <label for="collectionDescription">Description (Optional)</label>
                    <textarea id="collectionDescription" name="description" maxlength="200"></textarea>
                </div>
                <div class="button-group">
                    <button type="button" onclick="modal.close('collectionModal')">Cancel</button>
                    <button type="submit">Create Collection</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Theme Controls -->
    <div class="theme-controls">
        <button data-theme-option="light" onclick="themeSwitcher.setTheme('light')">☀️ Light</button>
        <button data-theme-option="dark" onclick="themeSwitcher.setTheme('dark')">🌙 Dark</button>
        <button data-theme-option="system" onclick="themeSwitcher.setTheme('system')">🖥️ System</button>
    </div>

    <!-- Font Controls -->
    <div class="font-controls">
        <button data-font-control="decrease" onclick="fontSizeControl.adjust(-1)">A-</button>
        <button data-font-control="increase" onclick="fontSizeControl.adjust(1)">A+</button>
    </div>

    <!-- Scripts -->
    <script src="/static/javascript/app.js"></script>
</body>
</html>
