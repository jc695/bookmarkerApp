<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title | default("Article Dashboard") }}</title>
    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTMX CDN -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- HTMX response-targets extension -->
    <script src="https://unpkg.com/htmx.org/dist/ext/response-targets.js"></script>
    <!-- HTMX events extension -->
    <!-- <script src="/static/javascript/htmx_events.js"></script> -->
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
    <nav class="bg-white shadow-md p-4">
        <div class="container mx-auto">
            <a href="/" class="text-xl font-bold text-gray-800">Article Dashboard</a>
        </div>
    </nav>
    <main class="container mx-auto p-4 flex-grow">
        {% block content %}{% endblock %}
    </main>
    <footer class="bg-gray-200 text-center p-4">
        <p class="text-gray-600">Powered by FastAPI, HTMX, and TailwindCSS</p>
    </footer>
</body>
</html>
