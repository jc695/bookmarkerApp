<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookmarker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="icon" href="/static/favicon.ico">
</head>
<body>
    <header class="navbar navbar-expand-md navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="/dashboard">Bookmarker</a>
            <button class="btn btn-primary" 
                    data-bs-toggle="modal"
                    data-bs-target="#addArticleModal">
                Add New
            </button>
        </div>
    </header>

    <main class="container-fluid mt-4">
        {% block content %}{% endblock %}
    </main>

    <!-- Add Article Modal -->
    <div class="modal fade" id="addArticleModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Save Article</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <form hx-post="/save" hx-target="#articleGrid" hx-swap="beforeend">
                    <div class="modal-body">
                        <input type="url" name="url" class="form-control mb-3" 
                               placeholder="Enter article URL" required>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">Save Article</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast align-items-center text-white bg-success border-0 position-fixed top-0 end-0 m-3">
        <div class="d-flex">
            <div class="toast-body"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
