{% extends "layout/base.html" %}

{% block content %}
<nav class="navbar navbar-expand-md navbar-light bg-light mb-4">
    <div class="container-fluid">
        <a href="/dashboard" class="btn btn-outline-secondary">← Back to Dashboard</a>
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-outline-secondary">Tag</button>
            <button class="btn btn-outline-secondary">★ Favorite</button>
        </div>
    </div>
</nav>

<div class="container-fluid">
    <h1 class="mb-4">{{ article.title }}</h1>
    <div class="d-flex gap-3 mb-3 text-muted">
        <a href="{{ article.url }}" class="text-decoration-none">{{ article.domain }}</a>
        <span>{{ article.reading_time }} min read</span>
        <span>Published: {{ article.date_published }}</span>
    </div>
    <div class="article-content mb-4">
        {{ article.content|safe }}
    </div>
    <a href="{{ article.url }}" class="btn btn-link">View Original</a>
</div>
{% endblock %}
