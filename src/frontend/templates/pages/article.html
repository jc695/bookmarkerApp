{% extends "layout/base.html" %}

{% block content %}
<div class="flex justify-center items-center min-h-[calc(100vh-8rem)]">
    <div class="bg-white shadow-md rounded-lg p-6 w-full max-w-3xl">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">{{ article.title }}</h1>
        <p class="text-sm text-gray-600 mb-4">
            Source: <a href="{{ article.source_url }}" class="text-blue-500 hover:underline" target="_blank">{{ article.source_url }}</a>
        </p>
        <div class="prose text-gray-700">
            {{ article.content | safe }}
        </div>
        <div class="mt-6 text-right">
            <a href="/dashboard" class="text-blue-500 hover:underline">Back to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
