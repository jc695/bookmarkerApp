{% extends "layout/base.html" %}

{% block content %}
<div class="flex flex-col items-center justify-center min-h-[calc(100vh-8rem)]">
    <h1 class="text-4xl font-bold text-gray-800 mb-6">Your Articles</h1>

    <!-- Form to add new article -->
    <form 
        hx-post="/save" 
        hx-target="#article-list" 
        hx-swap="beforeend" 
        hx-indicator="#loading"
        hx-target-error="#popup-feedback"
        class="w-full max-w-md mb-8"
    >
        <div class="flex gap-2">
            <input 
                type="url" 
                name="url" 
                placeholder="Enter article URL" 
                class="w-full p-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                required
            >
            <button 
                type="submit" 
                class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 relative"
            >
                Save
                <span id="loading" class="htmx-indicator absolute inset-0 flex items-center justify-center bg-gray-200 bg-opacity-75 rounded hidden">
                    <svg class="animate-spin h-5 w-5 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8h8a8 8 0 01-8 8 8 8 0 01-8-8z"></path>
                    </svg>
                </span>
            </button>
        </div>
    </form>

    <!-- Article List -->
    <div id="article-list" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 w-full max-w-6xl">
        {% for article_id, article in articles %}
        {% include "partials/article_card.html" %}
        {% endfor %}
    </div>

    <!-- Popup Feedback Container -->
    <div id="popup-feedback" class="fixed bottom-4 right-4"></div>
</div>

<!-- TailwindCSS Animation Styles -->
<style>
    .animate-fade-in {
        animation: fadeIn 0.5s ease-in;
    }
    .animate-fade-out {
        animation: fadeOut 0.5s ease-out forwards;
    }
    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeOut {
        from { opacity: 1; transform: translateY(0); }
        to { opacity: 0; transform: translateY(10px); }
    }
</style>
{% endblock %}
