{% extends "layout/base.html" %}

{% block content %}
<!-- Main Content Section -->
<div class="dashboard-container">
    <!-- Action Bar -->
    <button  style="color: blue;">\\\\\\\\\\ Action Bar \\\\\\\\\</button>

     <div class="tomato">
        <form hx-post="/save" hx-target="#articleGrid" hx-swap="beforeend">
            <input type="url" name="url" placeholder="Enter article URL" required>
            <button type="submit">Save Article</button>
        </form>
     </div>
    <div class="action-bar">
        <button id="refreshAllBtn">Refresh All</button>
        <input type="search" placeholder="Search articles..." id="searchInput">
        <button id="filterBtn">Filters</button>

    </div>

    <!-- Article Grid -->
    <div class="article-grid" id="articleGrid">
        {% if articles %}
            {% for article in articles %}
                {% include "partials/article_card.html" %}
            {% endfor %}
        {% else %}
            <p>No articles saved yet</p>
        {% endif %}
    </div>

    <!-- Add Article Form -->
    <div class="add-article-section">
        <h3>Save New Article</h3>
        <form hx-post="/save" hx-target="#articleGrid" hx-swap="beforeend">
            <input type="url" name="url" placeholder="Enter article URL" required>
            <button type="submit">Save Article</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
// HTMX configuration
htmx.config.useTemplateFragments = true;

// Search functionality
document.getElementById('searchInput').addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    document.querySelectorAll('.article-card').forEach(card => {
        const title = card.querySelector('.article-title').textContent.toLowerCase();
        card.style.display = title.includes(term) ? 'block' : 'none';
    });
});

// Collection creation handler
document.getElementById('newCollectionBtn').addEventListener('click', () => {
    // This would trigger your collection creation modal
    // Assuming you have a modal in your base template
    const modal = document.getElementById('collectionModal');
    modal.style.display = 'block';
});

// Delete confirmation
document.addEventListener('htmx:confirm', (evt) => {
    evt.detail.issueRequest = confirm('Are you sure you want to delete this article?');
});
</script>
{% endblock %}
