<div class="article-card" data-id="{{ article.id }}">
  <img src="{{ article.thumbnail }}" class="thumbnail" />
  <div class="card-content">
    <h3 class="article-title">{{ article.title }}</h3>
    <a href="{{ article.url }}" target="_blank" class="article-domain">{{ article.domain }}</a>
    
    <div class="card-actions">
      <!-- Menu trigger button -->
      <button class="menu-btn">⋯</button>
      
      <!-- Action menu -->
      <div class="menu">
        <div class="menu-items">
          <button class="menu-item delete"
                  hx-delete="/article/{{ article.id }}"
                  hx-target="closest .article-card"
                  hx-confirm="Are you sure you want to delete this article?">
            Delete
          </button>
          <button class="menu-item share">Share</button>
          <button class="menu-item tag">Add Tag</button>
          <button class="menu-item archive">Archive</button>
          <button class="menu-item favorite">Favorite</button>
          <button class="menu-item add-collection">Add to Collection</button>
          <button class="menu-item refresh">Refresh Link</button>
        </div>
      </div>
    </div>
  </div>
</div>
