<div class="article-card bg-white shadow-md rounded-lg p-4" data-id="/article/{{ article_id }}">
    <h2 class="text-xl font-semibold text-gray-800">{{ article.title }}</h2>
    <p class="text-sm text-gray-600">{{ article.site_name }}</p>
    <div class="mt-4 flex justify-end gap-2">
        <a 
            href="/article/{{ article_id }}" 
            class="text-blue-500 hover:underline"
        >View</a>
        <button 
            hx-delete="/article/{{ article_id }}" 
            hx-target="closest .article-card" 
            hx-swap="delete"
            class="text-red-500 hover:text-red-700"
        >Delete</button>
    </div>
</div>
