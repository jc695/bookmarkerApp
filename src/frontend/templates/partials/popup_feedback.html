<div id="popup-feedback" class="fixed bottom-4 right-4 bg-red-500 text-white p-4 rounded-lg shadow-lg animate-fade-in">
    {{ message }}
    <script>
        setTimeout(() => {
            document.getElementById("popup-feedback").classList.add("animate-fade-out");
            setTimeout(() => {
                document.getElementById("popup-feedback").remove();
            }, 500); // Match animation duration
        }, 2000); // Vanish after 2 seconds
    </script>
</div>
